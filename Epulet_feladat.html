<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ugrás Számítás</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h1>Épületek közötti ugrás számítás</h1>

  <div class="mb-3">
    <label for="Height1" class="form-label">Első épület magassága (méter):</label>
    <input type="number" id="Height1" class="form-control">
  </div>

  <div class="mb-3">
    <label for="Height2" class="form-label">Második épület magassága (méter):</label>
    <input type="number" id="Height2" class="form-control">
  </div>

  <div class="mb-3">
    <label for="Distance" class="form-label">Két épület közötti távolság (méter):</label>
    <input type="number" id="Distance" class="form-control">
  </div>

  <button onclick="calculateJump()" class="btn btn-primary">Ugrás számítás</button>

  <h2 class="mt-3">Eredmény: <span id="JumpResult"></span></h2>

  <script>
    function calculateJump() {
      const h1 = parseFloat(document.getElementById('Height1').value);
      const h2 = parseFloat(document.getElementById('Height2').value);
      const distance = parseFloat(document.getElementById('Distance').value);

      const JumpDistance = Math.sqrt(distance**2 + (h1 - h2)**2);
      document.getElementById('JumpResult').innerText = JumpDistance.toFixed(2) + ' méter';
    }
  </script>
</body>
</html>
