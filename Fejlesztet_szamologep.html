<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Többszámú Számológép</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h1>Többszámú Számológép</h1>

  <div class="mb-3">
    <label for="Numbers" class="form-label">Számok (írja be a számokat, majd adja meg a * karaktert a számután amit elszeretne választani):</label>
    <input type="text" id="Numbers" class="form-control" placeholder="Számok beírása pl.: 5* 10* 20">
  </div>

  <button onclick="MultiCalculate('Addition')" class="btn btn-primary m-1">Összeadás</button>
  <button onclick="MultiCalculate('Subtraction')" class="btn btn-primary m-1">Kivonás</button>
  <button onclick="MultiCalculate('Multiplication')" class="btn btn-primary m-1">Szorzás</button>
  <button onclick="MultiCalculate('Division')" class="btn btn-primary m-1">Osztás</button>

  <h2 class="mt-3">Eredmény: <span id="MultiResult"></span></h2>

  <script>
    function MultiCalculate(operation) {
      let Numbers = document.getElementById('Numbers').value.split('*').map(Number);
      let result;

      switch (operation) {
        case 'Addition':
          result = Numbers.reduce((acc, num) => acc + num, 0);
          break;
        case 'Subtraction':
          result = Numbers.reduce((acc, num) => acc - num);
          break;
        case 'Multiplication':
          result = Numbers.reduce((acc, num) => acc * num, 1);
          break;
        case 'Division':
          result = Numbers.reduce((acc, num) => acc / num);
          break;
        default:
          result = 'Error!';
      }

      document.getElementById('MultiResult').innerText = result;
    }
  </script>
</body>
</html>
